<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Dish - CodeBite</title>
    <link rel="icon" type="image/x-icon" href="../images/logo.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <div class="logo-icon">
                    <i class="fa-solid fa-burger text-white"></i>
                </div>
                CodeBite
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./searchRestaurant.html">Restaurants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./searchDish.html">Dishes</a>
                    </li>
                    <li class="nav-item cart-link d-none">
                        <a class="nav-link" href="./order.html">
                            <i class="fas fa-shopping-cart"></i> Cart
                            <span id="cart-count" class="badge bg-danger ms-1">0</span>
                        </a>
                    </li>
                </ul>
                <a href="../pages/login.html" class="btn login-btn btn-primary">Log In</a>
                <a href="./profile.html" class="btn my-profile-btn btn-outline-primary me-2 d-none">My Profile</a>
                <a href="./restaurantDashboard.html" class="btn my-restaurant-btn btn-outline-primary me-2 d-none">My Restaurant</a>
                <a href="./orderHistory.html" class="btn my-orders-btn btn-outline-primary me-2 d-none">My Orders</a>
                <a href="#" class="btn logout-btn btn-primary d-none">Log Out</a>
            </div>
        </div>
    </nav>

    <section id="search" class="main-section" style="margin-top: 80px;">
        <div class="search-container">
            <h4 class="mb-4 text-center">Find Your Favorite Dish</h4>
            
            <div class="position-relative mb-4">
                <input type="text" 
                       class="form-control search-input" 
                       id="dishSearchInput"
                       placeholder="Search for a dish (e.g., Pizza, Pasta)..."
                       autocomplete="off">
                <i class="fa-solid fa-utensils position-absolute top-50 end-0 translate-middle-y me-3"></i>
            </div>
            
            <div class="text-center mb-3">
                <small class="text-muted" id="searchDishResultsInfo">
                    Enter a dish name to start searching
                </small>
            </div>
        </div>
    </section>

    <section id="dishes" class="restaurant-section">
        <div class="container">
            <div id="dish-container" class="row">
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css">
    
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/searchDish.js"></script>
</body>
</html>
